name: Generar sitio

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "datos/**.yaml"
      - "scripts/**.js"

permissions:
  contents: write

# evita que dos corridas seguidas intenten pushear al mismo tiempo
concurrency:
  group: generar-sitio
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar index.html, enlaces/, ensenanza/, proyectos/ y el menú de js/nav.js desde datos/*.yaml
        run: node scripts/generar-sitio.js

      - name: Commitear páginas generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html enlaces ensenanza proyectos js/nav.js
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Generar sitio automáticamente"
            git push
          fi
