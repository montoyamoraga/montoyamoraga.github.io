  en: theoretical course for first year students, where we review the foundations of mathematical thought applied to design, including algebra, geometry, trigonometry, and logic.
  es: curso teórico de primer año, para sentar las bases del pensamiento matemático a estudiantes de diseño, incluyendo álgebra, geometría, trigonometría y lógica.
teaching-aud10004-course-description-1:
  en: we will learn to model problems in a parametric way, and taking into account the math behind computation and human perception of the physical reality.
  es: aprenderemos a modelar problemas de forma paramétrica, y tomando en cuenta la matemática detrás de la computación y la percepción humana de la realidad física.
teaching-aud10004-course-description-2:
  en: all the work will be done in public, collaboratively, with the students sharing their notes and applied research.
  es: el trabajo se hace de forma pública y compartida, con les estudiantes compartiendo sus apuntes y realizando trabajos de investigación aplicada.
