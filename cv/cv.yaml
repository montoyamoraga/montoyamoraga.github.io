  # curriculum-udp-36
  otras-actividades-docentes-destacables:
    - nombre:
        en: training of student and teaching assistant, mateo ignacio arce moore
        es: formación de alumno y ayudante, mateo ignacio arce moore
      institucion:
        en: universidad diego portales
        es: universidad diego portales
      pais:
        en: chile
        es: chile
      anho:
        en: 2023
        es: 2023
      detalle:
        en: Mateo Arce graduated with highest honors (6.7) from Diseño UDP in December 2025, with a mention in Graphic Design, after being an outstanding student in my digital interaction advanced courses in 2024, and working as a teaching assistant in my studios and new courses in 2025 and 2026, as well as in professor Manuel Córdova's courses. In 2026 he joined the Master's in Media Arts program at Universidad de Chile, and since 2025 has worked as a freelancer at my microenterprise Piruetas SpA, on programming projects and graphic identity design for synthesizers.
        es: Mateo Arce se graduó con nota 6.7 distinción máxima en Diseño UDP en diciembre 2025, con mención en Diseño gráfico, tras haber sido estudiante destacado de mis cursos de profundización de interacción digital en 2024, y haber trabajado como ayudante en mis talleres y cursos nuevos en 2025 y 2026, y en cursos del profesor Manuel Córdova. En el año 2026 ingresa al Magíster de Artes Mediales de la Universidad de Chile, y desde el 2025 trabaja como freelancer en mi microempresa Piruetas Spa, en proyectos de programación y diseño de identidades gráficas para sintetizadores.
    - nombre:
        en: training of student and teaching assistant and professor, janis valentina sepúlveda vera
        es: formación de alumna ayudante académica janis valentina sepúlveda vera
      institucion:
        en: universidad diego portales
        es: universidad diego portales
      pais:
        en: chile
        es: chile
      anho:
        en: 2023
        es: 2023
      detalle:
        en: Janis Sepúlveda graduated with highest honors (7.0) from Diseño UDP in December 2025, with a mention in Industrial Design, after being an outstanding student in the studios I taught with Sergio Majluf in 2023, and working since 2024 as the first teaching assistant for several of my new digital interaction courses. In 2026 she joined the Master's in Advanced Design program at Pontificia Universidad Católica de Chile on a scholarship, taught her first course as lead professor at Universidad de O'Higgins, and became the first employee at my microenterprise Piruetas SpA, in the role of project administrator and programmer.
        es: Janis Sepúlveda se graduó con nota 7.0 distinción máxima en Diseño UDP en diciembre 2025, con mención en Diseño industrial, tras haber sido estudiante destacada de los talleres que dicté con Sergio Majluf en 2023, y trabajar desde 2024 como la primera ayudante de varios de mis cursos nuevos de la mención de interacción digital. En el año 2026 ingresa becada al Magíster de Diseño Avanzado en la Pontificia Universidad Católica de Chile, dicta su primer curso como profesora responsable en la Universidad de O'Higgins y se convierte en la primera empleada a mi microempresa Piruetas SpA, con el rol de administradora de proyectos y programadora.
