  breve-resumen-trayectoria-academica:
    en: false
    es:
      Licenciatura y título profesional en ingeniería civil electricista de la Pontificia
      Universidad Católica de Chile (2008 - 2014). Máster MPS en arte electrónico
      de New York University, Tisch School of the Arts, Interactive Telecommunications
      Program (2015 - 2017), financiado por Becas Chile, tanto arancel como manutención.
      Residente postdoctoral de investigación en New York University, Tisch School
      of the Arts (2017 - 2018). Máster MAS en artes mediales y ciencias de Massachusetts
      Institute of Technology Media Lab. (2019-2021), financiado por beca de asistente
      de investigación de MIT Media Lab. Estudiante de segundo año del Doctorado en
      Artes y Humanidades de la Universidad de Santiago de Chile, (2025 - 2029) con
      beca de exención de arancel otorgada por la Vicerrectoría de postgrado USACH.
      Previamente fue profesore de ciencias básicas en Facultad de Arquitectura y
      Urbanismo de la Universidad de Chile (2022 - 2025). Profesore asistente media
      jornada y director del Laboratorio de Interacción Digital (LID UDP) en la Facultad
      de Arquitectura, Arte y Diseño de la Universidad Diego Portales (2023 - presente).
      El año 2024 recibe el Premio a la Innovación y Liderazgo Docente UDP a nivel
      FAAD, y el año 2026 el premio de Mejor Encuesta Docente de cursos teóricos de
      la Escuela de Diseño UDP.
