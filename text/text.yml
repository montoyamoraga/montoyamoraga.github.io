teaching-aud5i022-course-description-0:
  en: elective course of design, where we study the foundations of electronics and physical computing applied, including programming applied to microcontrollers.
  es: curso electivo de diseño, donde estudiamos los fundamentos de electrónica y computación física, incluyendo el estudio de código aplicado a microcontroladores.
teaching-aud5i022-course-description-1:
  en: we will learn how to use and connect sensors and actuators, including potentiometers, buzzers, pushbuttons, and their conection to Arduino boards, and the serial, MIDI, and OSC protocols.
  es: aprenderemos a usar sensores y actuadores, incluyendo potenciómetros, zumbadores, pulsadores, y su conexión a placas Arduino, además de protocolos como serial, MIDI y OSC.
teaching-aud5i022-course-description-2:
  en: all the work will be done in public, collaboratively, with the students sharing their notes and doing group projects of applied research.
  es: el trabajo se hace de forma pública y compartida, con les estudiantes compartiendo sus apuntes y realizando trabajos grupales de investigación aplicada.
