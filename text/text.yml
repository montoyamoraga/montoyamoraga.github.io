teaching-dis8637-course-description-0:
  en: in this practical and theoretical studio class we will learn how to perform user research, and creative use of digital prototyping tools, web and microcontroller programming languages, and use of analog and digital sensors and actuators.
  es: este taller es un curso práctico y teórico, donde abordamos investigación y metodología de trabajo con usuarios, uso creativo de herramientas de prototipado digital, lenguajes de programación web y de microcontroladores y uso de sensores y actuadores análogos y digitales.
teaching-dis8637-course-description-1:
  en: we will develop applied projects in order to understand users' needs, create digital devices and instruments for human-computer interaction (HCI), in order to create innovative user experiences.
  es: desarrollamos proyectos aplicados para comprender las necesidades de los usuarios, implementar dispositivos e instrumentos digitales para interacción humano-computador (HCI), y así lograr experiencias de usuario innovadoras.
teaching-dis8637-course-description-2:
  en: the outcomes of this studio class will be both foundations for academic research and playful experimentation applied to professional projects.
  es: los productos de este curso son conducentes tanto a generar publicaciones académicas como también la experimentación lúdica y creación de proyectos para el mundo profesional.
