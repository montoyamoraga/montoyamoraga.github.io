    antecedentes-adicionales:
      en: "Piruetas is a joint-stock company (SpA) founded in Santiago in 2022 by Aarón Montoy Moraga. Piruetas develops software and hardware for creative purposes; projects include handcrafted musical synthesizers and MIDI controllers, robot-assisted drawing software, and AI devices using microcontrollers. Piruetas is also the official distributor in Latin America of the musical instruments BASTL, designed and built in the Czech Republic."
      es: "piruetas es una sociedad por acciones (SpA) fundada en Santiago el año 2022 por Aarón Montoy Moraga. piruetas se dedica al desarrollo de software y hardware para fines creativos, entre sus proyectos incluyen la construcción artesanal de sintetizadores musicales y controladores MIDI, el desarrollo de software para dibujo asistido por robots, y dispositivos de inteligencia artificial con microcontroladores. piruetas también es el único distribuidor oficial en Latinoamérica de los instrumentos musicales BASTL, diseñados y construidos en República Checa."
