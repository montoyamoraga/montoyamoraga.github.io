    - slug: camilo-catrillanca-mirror
      titulo: camilo-catrillanca-mirror
      anho: 2019
      creditos:
        - rol: { es: "investigación, concepto, programación", en: "research, concept, programming" }
          nombre: montoyamoraga
      descripcion:
        - es: homenaje a camilo catrillanca, joven mapuche y activista por los derechos estudiantiles y del pueblo mapuche, asesinado el 14 de noviembre de 2018, a los 24 años, por un disparo por la espalda del sargento de carabineros carlos alarcón, en ercilla, en el sur de chile.
          en: a tribute to camilo catrillanca, a young mapuche activist for the rights of students and of the mapuche people, killed on november 14 2018, at age 24, shot in the back by carlos alarcón, a sergeant of the chilean police, in ercilla, in the south of chile.
        - es: un algoritmo de transferencia de estilo fue entrenado con la fotografía más difundida de camilo, y aplica su estilo en tiempo real a la imagen de la cámara web, para que nos veamos reflejades en la imagen de camilo.
          en: a style transfer algorithm was trained on the most widely circulated photograph of camilo, and applies its style in real time to the webcam feed, so that we see ourselves reflected in camilo's image.
        - es: la obra corre lento, a cerca de un cuadro por segundo, y produce una imagen borrosa, de baja fidelidad y críptica, como la memoria que nos va quedando de camilo, reducida a una fotografía y un video, mientras la violencia policial continúa.
          en: the piece runs slowly, at about one frame per second, and produces a hazy, low-fidelity and cryptic image, like our fading memory of camilo, reduced to one photograph and one video, while police brutality continues.
        - es: camilo debería estar vivo.
          en: camilo should be alive.
      ficha:
        - rotulo: { es: materiales, en: materials }
          valor: ml5.js, p5.js
      exhibiciones:
        - anho: 2019
          evento: "uptown bounce: emerging latinx identities, recientemente posible"
          lugar: el museo del barrio
          ciudad: { es: nueva york, en: new york }
          enlace: https://web.archive.org/web/20190802124519/https://www.elmuseo.org/event/uptown-bounce-july-31-2019/
      enlaces:
        - texto: { es: versión web, en: web version }
          url: https://montoyamoraga.io/camilo-catrillanca-mirror/
