      pais:
        en: chile
        es: chile
      anho:
        en: 2023
        es: 2023
      detalle:
        en: false
        es: Mateo Arce se graduó con nota 6.7 distinción máxima en Diseño UDP en diciembre 2025, con mención en Diseño gráfico, tras haber sido estudiante destacado de mis cursos de profundización de interacción digital en 2024, y haber trabajado como ayudante en mis talleres y cursos nuevos en 2025 y 2026, y en cursos del profesor Manuel Córdova. En el año 2026 ingresa al Magíster de Artes Mediales de la Universidad de Chile, y desde el 2025 trabaja como freelancer en mi microempresa Piruetas Spa, en proyectos de programación y diseño de identidades gráficas para sintetizadores.
    - nombre:
        en: training of student and teaching assistant and professor, janis valentina sepúlveda vera
        es: formación de alumna ayudante académica janis valentina sepúlveda vera
      institucion:
        en: universidad diego portales
        es: universidad diego portales
      pais:
        en: chile
        es: chile
      anho:
        en: 2023
        es: 2023
      detalle:
        en: false
        es: Janis Sepúlveda se graduó con nota 7.0 distinción máxima en Diseño UDP en diciembre 2025, con mención en Diseño industrial, tras haber sido estudiante destacada de los talleres que dicté con Sergio Majluf en 2023, y trabajar desde 2024 como la primera ayudante de varios de mis cursos nuevos de la mención de interacción digital. En el año 2026 ingresa becada al Magíster de Diseño Avanzado en la Pontificia Universidad Católica de Chile, dicta su primer curso como profesora responsable en la Universidad de O'Higgins y se convierte en la primera empleada a mi microempresa Piruetas SpA, con el rol de administradora de proyectos y programadora.
