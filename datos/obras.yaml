# datos de las obras, usados por scripts/generar-obras.js para generar
# proyectos/<serie>/<obra>/index.html, la lista de series en
# proyectos/index.html y el menú de proyectos en js/menu.js.
#
# el orden de las listas define el orden en la página y en el menú.
#
# schema por serie:
#   slug:    string, nombre de la carpeta en proyectos/<slug>/
#   titulo:  string, o { es, en } si se traduce
#   obras:   lista de obras (opcional; una serie sin obras se muestra
#            como "sin obras publicadas")
#
# schema por obra:
#   slug:        string, nombre de la carpeta en proyectos/<serie>/<slug>/
#   titulo:      string, o { es, en } si se traduce
#   anho:        número (opcional)
#   descripcion: lista de { es, en } (un párrafo por ítem, opcional)
#   ficha:       lista de { rotulo: { es, en }, valor: string o { es, en } }
#                (opcional, ej. materiales, duración, técnica)
#   creditos:    lista de { rol: string o { es, en }, nombre: string,
#                enlace: URL (opcional) } (opcional). los créditos con el
#                mismo rol se muestran juntos en una línea.
#   exhibiciones: lista de { anho, evento, lugar, ciudad, enlace } (opcional,
#                todos los campos opcionales; evento, lugar y ciudad aceptan
#                string o { es, en })
#   enlaces:     lista de { texto: string o { es, en }, url } (opcional, ej.
#                prensa, código, registro en video)
#   medios:      lista de archivos (opcional). los .mp4/.webm/.mov se
#                muestran como video, el resto como imagen. se aceptan
#                rutas absolutas del sitio (/assets/...) o URLs, por
#                ejemplo del repositorio montoyamoraga-web-media:
#                https://cdn.jsdelivr.net/gh/montoyamoraga/montoyamoraga-web-media@main/<carpeta>/webp/00.webp
#                cada ítem puede ser solo la ruta, o { archivo, alt, pie,
#                credito } para agregar texto alternativo, un pie de foto
#                (string o { es, en }) y quién tomó la foto.
#   prevista:    opcional, imagen que se muestra al compartir el enlace (whatsapp,
#                redes sociales): nombre de archivo en la carpeta previstas/ del
#                repositorio montoyamoraga-web-media, o URL completa. sin prevista
#                se usa previstas/sitio.jpg
#
# una obra sin descripción ni medios se muestra como "próximamente".
#
# para agregar una obra nueva: agregar una entrada acá y hacer push a main.
# el GitHub Action regenera las páginas y el menú automáticamente.

