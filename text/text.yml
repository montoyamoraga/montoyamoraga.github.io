teaching-dis9034-course-description-0:
  en: theoretical and practical course, centered in the use and creation of software as a plastic medium for design.
  es: curso teórico-práctico, centrado en el uso y creación de software como un medio plástico para el diseño.
teaching-dis9034-course-description-1:
  en: we will learn the fundamental programming blocks (variables, functions, iterations, conditions) and we will apply them to the foundations of audiovisual creation, including color, video and audio, in order to create static and dynamic works.
  es: aprenderemos los bloques fundamentales de la programación (variables, funciones, iteraciones, condicionales) y los aplicaremos a los elementos fundamentales de creación audiovisual, incluyendo color, video y audio, para componer obras tanto estáticas como dinámicas.
teaching-dis9034-course-description-2:
  en: all the work will be done in public, collaboratively, and with a strong emphasis on open source, free and multiplatform tools.
  es: el trabajo se hace de forma pública, compartida, y con un fuerte énfasis en herramientas de fuente abierta, libres y multi plataforma.
