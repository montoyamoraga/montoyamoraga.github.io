# datos de los cursos de enseñanza, usados por scripts/generar-ensenanza.js
# para generar ensenanza/<slug>/index.html y el menú de enseñanza en js/nav.js.
#
# el orden de esta lista define el orden dentro de cada grupo del menú.
#
# schema por curso:
#   slug:        string, nombre de la carpeta en ensenanza/<slug>/
#   universidad: udp | uchile | uai — agrupa el menú
#   titulo:      { es, en }
#   institucion: lista de { es, en } (una línea por ítem)
#   fechas:      lista de { texto: { es, en }, url (opcional) }
#                sin url se renderiza como texto plano, con url como link
#   descripcion: lista de { es, en } (un párrafo por ítem)
#   equipo:      lista de { nombre, rol: { es, en } } (nombre no se traduce)
#   imagenes:    lista de nombres de archivo (se resuelven a images/<archivo>
#                dentro de la carpeta del curso) o URLs absolutas (se usan tal cual)
#
# para agregar un curso nuevo: agregar una entrada acá (+ opcionalmente
# ensenanza/<slug>/images/ con las fotos), hacer push a main. el GitHub Action
# regenera ensenanza/<slug>/index.html y el menú automáticamente.

- slug: dis9079
  universidad: udp
  titulo:
    en: dis9079 - wireless interaction design
    es: dis9079 - interacciones inalámbricas
  institucion:
    - en: universidad diego portales
      es: universidad diego portales
    - en: faculty of architecture, arts, and design
      es: facultad de arquitectura, arte y diseño
    - en: design school
      es: escuela de diseño
  fechas:
    - texto:
        en: first term 2026 (march - july)
        es: primer semestre 2026 (marzo - julio)
  descripcion:
    - en: a theoretical and practical course oriented toward the study and development of interaction design projects using wireless tools. the course explores the possibilities offered by the responsible implementation of small- and medium-scale wireless interactive systems.
      es: curso de carácter teórico-práctico orientado al estudio y desarrollo de proyectos de creación de diseño de interacción a través de herramientas inalámbricas. la asignatura explora las posibilidades que ofrece la articulación responsable de la implementación de sistemas interactivos inalámbricos a pequeña y mediana escala.
    - en: the course covers three thematic units - design and use of protocols and microcontrollers for wireless communications, analysis and writing of software and microcontroller code for wireless communications, and design of interactive experiences with wireless technologies.
      es: el curso contempla tres unidades temáticas - diseño y uso de protocolos y microcontroladores para comunicaciones inalámbricas, análisis y escritura de software y microcontroladores para comunicaciones inalámbricas y diseño de experiencias interactivas con tecnologías inalámbricas.
  equipo:
    - nombre: aarón montoya-moraga
      rol:
        en: professor
        es: profesore
    - nombre: mateo arce
      rol:
        en: teaching assistant
        es: ayudante
  imagenes: []
- slug: dis09214
  universidad: udp
  titulo:
    en: dis09214 - computational thinking
    es: dis09214 - pensamiento computacional
  institucion:
    - en: universidad diego portales
      es: universidad diego portales
    - en: faculty of architecture, arts, and design
      es: facultad de arquitectura, arte y diseño
    - en: design school
      es: escuela de diseño
  fechas:
    - texto:
        en: first term 2026 (march - july)
        es: primer semestre 2026 (marzo - julio)
  descripcion:
    - en: the computational thinking course introduces design students to the logical, structured and creative reasoning of computing as a tool to analyze and create systems, flows and behaviors. through visual, logical and experiential exercises, students explore how to think with input-process-output structures, recognizing patterns, sequences and algorithms as expressive languages within contemporary design.
      es: el curso pensamiento computacional introduce a los estudiantes de diseño al uso del razonamiento lógico, estructurado y creativo propio de la computación como herramienta para analizar y crear sistemas, flujos y comportamientos. a través de ejercicios visuales, lógicos y experienciales, se explora cómo pensar con estructuras de entrada, proceso y salida, reconociendo patrones, secuencias y algoritmos como lenguajes expresivos en el contexto del diseño contemporáneo.
    - en: this course is based on experimentation with visual tools and accessible platforms to build simple interactive experiences, generative systems, visualizations and behavior flows. it prioritizes an understandable, creative and applied approach to computing, focused on understanding logic rather than syntax, promoting conceptual autonomy for future courses in programming, data or advanced digital interaction.
      es: este curso se basa en la experimentación con herramientas visuales y plataformas accesibles para construir experiencias interactivas simples, sistemas generativos, visualizaciones y flujos de comportamiento. se prioriza una aproximación comprensible, creativa y aplicada a lo computacional, enfocada en comprender la lógica, más que la sintaxis, promoviendo autonomía conceptual para cursos futuros de programación, datos o interacción digital avanzada.
    - en: additionally, the course establishes the conceptual foundations needed to later access more advanced environments such as physical computing, IoT, sensors, actuators or peripheral devices.
      es: adicionalmente, el curso establece las bases conceptuales necesarias para acceder posteriormente a entornos más avanzados como computación física, IoT, sensores, actuadores o dispositivos periféricos.
  equipo:
    - nombre: aarón montoya-moraga
      rol:
        en: professor
        es: profesore
    - nombre: vania paredes
      rol:
        en: teaching assistant
        es: ayudante
  imagenes: []
