teaching-dis9005-course-description-0:
  en: theoretical and practical course, oriented to the design and development of responsive, interactive and dynamic websites,  using the HTML, CSS and JavaScript languages.
  es: curso teórico-práctico, orientada al diseño y desarrollo de sitios web responsivos, interactivos y dinámicos usando lenguajes HTML, CSS y JavaScript.
teaching-dis9005-course-description-1:
  en: we will perform user analysis, design of screens, and implementation with modern web programming languages.
  es: se llevarán cabo análisis de usuarios y necesidades, diseño de pantallas, e implementación con lenguajes de programación web.
teaching-dis9005-course-description-2:
  en: all the work will be done in public, collaboratively, and with a strong emphasis on open source, free and multiplatform tools.
