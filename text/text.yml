  en: elective course of design, where we study the foundations of artificial intelligence, from creating our own databases to training our own generative algorithms.
  es: curso electivo de diseño, donde estudiamos los fundamentos de inteligencia artificial, desde crear nuestras propias bases de datos, hasta entrenar nuestros propios algoritmos gen course of design, where we study the foundations of artificial intelligence, from creating our own databases to training our own generative algorithms.
teaching-audiv027-course-description-1:
  en: we will learn how to build our own image, sound and human pose databases, in order to create interactive installations. we will use Wekinator and ml5.js for privacy-first and browser-based work.
  es: aprenderemos a construir nuestras propias bases de datos de imágenes, sonido y poses humanas, para crear nuestras propias instalaciones interactivas. usaremos las herramientas Wekinator y  ml5-ks para privilegiar el trabajo en navegdaores web y de uso privado.
teaching-audiv027-course-description-2:
