name: Generar páginas de enseñanza

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "datos/ensenanza.yaml"
      - "scripts/generar-ensenanza.js"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar ensenanza/*/index.html y el menú de js/nav.js desde datos/ensenanza.yaml
        run: node scripts/generar-ensenanza.js

      - name: Commitear páginas generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ensenanza js/nav.js
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Generar páginas de enseñanza automáticamente"
            git push
          fi
