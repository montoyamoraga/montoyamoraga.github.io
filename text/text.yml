teaching-audiv020-course-description-0:
  en: elective course of design, where we study the foundations of electronic music interfaces, applied to programming of musical instruments with microcontrollers and computer music programming languages.
  es: curso electivo de diseño, donde estudiamos los fundamentos de interfaces para música electrónica, aplicada a la programación de instrumentso musicales hechos con microcontroladores y lenguajes de programación orientados a música.
teaching-audiv020-course-description-1:
  en: we will learn how to design tactile interfaces, finite state machines and multimedia feedback for live music performance. we will use microcontrollers running CircuitPython and the Chuck and Pure Data programming languages.
  es: aprenderemos a diseñar interfaces táctiles, máquinas de estado finitas, y retroalimentación multimedia para presentaciones de música en vivo. usaremos microcontroladores corriendo CircuitPython y programaremos software con los lenguajes ChucK y Pure Data.
teaching-audiv020-course-description-2:
  en: all the work will be done in public, collaboratively, with the students sharing their notes and applied research.
  es: el trabajo se hace de forma pública y compartida, con les estudiantes compartiendo sus apuntes y realizando trabajos grupales de investigación aplicada.
