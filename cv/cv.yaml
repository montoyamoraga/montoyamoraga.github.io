  breve-resumen-trayectoria-academica:
    en: Bachelor's and professional degree in electrical engineering from Pontificia Universidad Católica de Chile (2008 - 2014). Master of Professional Studies in electronic arts from New York University, Tisch School of the Arts, Interactive Telecommunications Program (2015 - 2017), funded by Becas Chile, covering both tuition and living expenses. Postdoctoral research resident at New York University, Tisch School of the Arts (2017 - 2018). Master of Science in media arts and sciences from Massachusetts Institute of Technology Media Lab (2019-2021), funded by an MIT Media Lab research assistantship. Second-year PhD student in Arts and Humanities at Universidad de Santiago de Chile (2025 - 2029), with a tuition exemption scholarship granted by the USACH Graduate Studies Office. Previously a professor of basic sciences at the Faculty of Architecture and Urbanism, Universidad de Chile (2022 - 2025). Part-time assistant professor at Diseño UDP since 2023, director of the Digital Interaction Laboratory (LID UDP) since 2024, and coordinator of the advanced and specialization course tracks at the Faculty of Architecture, Arts, and Design, Universidad Diego Portales (2023 - 2025). In 2024 received the UDP Teaching Innovation and Leadership Award at the FAAD level, and in 2026 the Best Teaching Survey Diploma for theoretical courses at the UDP Design School for the 2025 period.
    es: Licenciatura y título profesional en ingeniería civil electricista de la Pontificia Universidad Católica de Chile (2008 - 2014). Máster MPS en arte electrónico de New York University, Tisch School of the Arts, Interactive Telecommunications Program (2015 - 2017), financiado  por Becas Chile, tanto arancel como manutención. Residente postdoctoral de investigación en New York University, Tisch School of the Arts (2017 - 2018). Máster MAS en artes mediales y ciencias de Massachusetts Institute of Technology Media Lab. (2019-2021), financiado por beca de asistente de investigación de MIT Media Lab. Estudiante de segundo año del Doctorado en Artes y Humanidades de la Universidad de Santiago de Chile, (2025 - 2029) con beca de exención de arancel otorgada por la Vicerrectoría de postgrado USACH.  Previamente fue profesore de ciencias básicas en Facultad de Arquitectura y Urbanismo de la Universidad de Chile (2022 - 2025). Profesore asistente media jornada de Diseño UDP desde 2023, directore del Laboratorio de Interacción Digital (LID UDP) desde 2024, coordinadore de la líneas de cursos de profundización y de especialización en Facultad de Arquitectura, Arte y Diseño de la Universidad Diego Portales (2023 - 2025). El año 2024 recibe el Premio a la Innovación y Liderazgo Docente UDP a nivel FAAD, y el año 2026 el Diploma de Mejor Encuesta Docente de cursos teóricos de la Escuela de Diseño UDP por el periodo 2025.
