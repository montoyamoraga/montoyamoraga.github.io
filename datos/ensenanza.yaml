  descripcion:
    - en: our daily life is strongly mediated by interfaces in a wide array of platforms, which in turn configure the key elements of user experiencies, in the analog and digital realms.
      es: nuestra vida cotidiana está fuertemente intermediada por interfaces en diversas plataformas y soportes, que configuran a su vez uno de los elementos clave en experiencias de usuario análogas y digitales.
    - en: this is a practical and theoretical course, where we will learn strategies for research and methodological work with users, and we will explore prospective and creative interfaces with prototyping digital tools including Figma and p5.js.
      es: este es un curso práctico y conceptual, donde abordaremos desde la investigación y metodología de trabajo con usuarios, exploración de interfaces como instrumento de prospección y uso creativo de herramientas de prototipado digital como Figma y la plataforma de programación p5.js.
    - en: by developing applied projects during the semester, we will understand the users' needs and the design opportunities that arise. we will build innovative interfaces for both academic research of human-computer interaction (HCI), as well as playful experimentation and applications in professional contexts.
      es: con proyectos aplicados durante el semestre trabajaremos desde comprender las necesidades de los usuarios y las oportunidades que surgen en sus contextos, hasta la creación de interfaces innovadoras, conducentes tanto a generar publicaciones académicas del ámbito de interacción humano computador (HCI) como también la experimentación lúdica y creación de proyectos colaborativos con el mundo profesional.
